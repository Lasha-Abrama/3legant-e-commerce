<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — Gita_3_Team_2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header" data-active="Account"></div>

<main>
  <div class="wrap" style="display:flex;justify-content:center;">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-head__title">Forgot password?</div>
        <div class="auth-head__sub">Enter your email and we'll send you a secure reset link.</div>
      </div>

      <form id="forgot-password-form" style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <span class="field__label">EMAIL ADDRESS *</span>
          <input class="input" type="email" name="email" placeholder="Your email" autocomplete="email" required>
        </div>
        <div class="error-text" id="forgot-password-error"></div>
        <div class="success-text" id="forgot-password-success"></div>
        <button class="btn btn--dark" type="submit">Send reset link</button>
      </form>

      <div class="auth-footer"><a href="login.html">&larr; Back to login</a></div>
    </div>
  </div>
</main>

<div id="site-footer" data-variant="minimal"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/header.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
