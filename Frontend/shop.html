<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop — 3legant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/design.css" />
    <link rel="stylesheet" href="css/polish.css" />
    <link rel="stylesheet" href="css/shop.css" />
  </head>
  <body class="page-shop">
    <div id="site-header" data-active="Shop"></div>

    <main>
      <div class="page-hero">
        <img
          src="images/shop-hero.png"
          alt="Shop page hero"
          style="width: 100%; height: 100%; object-fit: cover; display: block"
        />
        <div class="page-hero__overlay">
          <div class="page-hero__crumb" data-breadcrumb-current="Shop"><a href="index.html">Home</a> › Shop</div>
          <h1 class="page-hero__title">Shop Page</h1>
          <div class="page-hero__sub">
            Let's design the place you always imagined.
          </div>
        </div>
      </div>

      <div class="wrap">
        <div class="shop-layout" data-view="three">
          <div class="shop-sidebar" id="shop-sidebar">
            <div class="filter-heading">
              <span data-store-icon="filter"></span> Filter
            </div>
            <div class="sidebar-label">CATEGORIES</div>
            <div class="category-list" id="category-list"></div>
            <div class="sidebar-label">PRICE</div>
            <div class="price-list" id="price-list"></div>
          </div>

          <div class="shop-results">
            <div class="section-head">
              <div
                style="font-size: 20px; font-weight: 600"
                id="active-category-label"
              >
                All Rooms
              </div>
              <div class="shop-controls">
                <div class="shop-top-filters">
                  <label>CATEGORIES<select id="category-select" aria-label="Category"></select></label>
                  <label>PRICE<select id="price-select" aria-label="Price"></select></label>
                </div>
                <button class="mobile-filter-toggle" id="mobile-filter-toggle">
                  <span data-store-icon="filter"></span> Filter
                </button>
                <select class="sort-select" id="sort-select" aria-label="Sort by">
                  <option value="newest">Newest</option>
                  <option value="oldest">Oldest</option>
                  <option value="price_asc">Price: Low to High</option>
                  <option value="price_desc">Price: High to Low</option>
                </select>
                <div class="shop-view-buttons" aria-label="Product layout">
                  <button
                    type="button"
                    data-shop-view="three"
                    aria-label="Three column grid"
                    aria-pressed="true"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2h5v5H2zm7 0h5v5H9zm7 0h5v5h-5zM2 9h5v5H2zm7 0h5v5H9zm7 0h5v5h-5zM2 16h5v5H2zm7 0h5v5H9zm7 0h5v5h-5z"/></svg></button
                  ><button
                    type="button"
                    data-shop-view="four"
                    aria-label="Four column grid"
                    aria-pressed="false"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/></svg></button
                  ><button type="button" data-shop-view="two" aria-label="Two column detailed view" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="13" y="3" width="7" height="18" rx="1"/></svg></button
                  ><button
                    type="button"
                    data-shop-view="list"
                    aria-label="List view"
                    aria-pressed="false"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <div id="shop-status" role="status" aria-live="polite"></div>
            <div class="grid-3" id="product-grid" aria-busy="false"></div>
            <div class="center shop-more">
              <button class="btn btn--outline" id="show-more">Show more</button>
            </div>
          </div>
        </div>
      </div>

      <div id="newsletter-slot"></div>
    </main>

    <div id="site-footer" data-variant="full"></div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product-card.js"></script>
    <script src="js/newsletter.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/header.js"></script>
    <script src="js/shop.js"></script>
  </body>
</html>
