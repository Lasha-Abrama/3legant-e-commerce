<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product — 3legant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/design.css" />
  </head>
  <body class="page-product">
    <div id="site-header" data-active="Product"></div>

    <main>
      <div class="wrap" id="product-root">
        <div class="breadcrumb" id="crumb">Home / Shop / Product</div>
        <div id="product-content"></div>

        <div style="margin-top: 50px">
          <div class="tab-row" id="tab-row"></div>
          <div id="tab-body"></div>
        </div>
      </div>
      <section
        class="section product-recommendations"
        id="product-recommendations"
        hidden
      >
        <div class="section-head">
          <h2>You might also like</h2>
          <a href="shop.html">More Products &rarr;</a>
        </div>
        <div class="product-row" id="recommended-products"></div>
      </section>
    </main>

    <div id="newsletter-slot"></div>
    <div id="site-footer" data-variant="full"></div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product-card.js"></script>
    <script src="js/newsletter.js"></script>
    <script src="js/header.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
