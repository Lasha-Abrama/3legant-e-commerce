<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up — 3legant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/design.css" />
  </head>
  <body class="page-register">
    <main class="auth-layout">
      <aside class="auth-art">
        <a class="site-header__logo" href="index.html">3legant<span>.</span></a
        ><img src="images/products/cozy-sofa.jpg" alt="Cream lounge chair" />
      </aside>
      <div class="auth-panel">
        <div class="auth-card">
          <div class="auth-head">
            <h1 class="auth-head__title">Sign Up</h1>
            <div class="auth-head__sub">
              Already have an account? <a href="login.html">Sign In</a>
            </div>
          </div>
          <form
            id="register-form"
            style="display: flex; flex-direction: column; gap: 14px"
          >
            <div class="row-2">
              <div class="field">
                <span class="field__label">FIRST NAME *</span
                ><input
                  class="input"
                  name="firstName"
                  aria-label="First name"
                  placeholder="First name"
                  required
                />
              </div>
              <div class="field">
                <span class="field__label">LAST NAME *</span
                ><input
                  class="input"
                  name="lastName"
                  aria-label="Last name"
                  placeholder="Last name"
                  required
                />
              </div>
            </div>
            <div class="field">
              <span class="field__label">EMAIL ADDRESS *</span
              ><input
                class="input"
                type="email"
                name="email"
                aria-label="Email address"
                placeholder="Email address"
                required
              />
            </div>
            <div class="field">
              <span class="field__label">PASSWORD *</span
              ><input
                class="input"
                type="password"
                name="password"
                aria-label="Password"
                placeholder="Create a password"
                required
              />
            </div>
            <div class="field">
              <span class="field__label">CONFIRM PASSWORD *</span
              ><input
                class="input"
                type="password"
                name="confirmPassword"
                aria-label="Confirm password"
                placeholder="Repeat password"
                required
              />
            </div>
            <label
              style="
                display: flex;
                align-items: flex-start;
                gap: 8px;
                font-size: 12px;
                color: var(--muted);
              "
            >
              <input type="checkbox" name="agree" style="margin-top: 2px" />
              <span
                >I agree to the
                <a href="terms.html" target="_blank" rel="noopener"
                  >Terms of Use</a
                >
                and
                <a href="privacy.html" target="_blank" rel="noopener"
                  >Privacy Policy</a
                ></span
              >
            </label>
            <div class="error-text" id="register-error"></div>
            <button
              class="btn btn--dark"
              type="submit"
              style="margin-top: 6px"
              aria-label="Create Account"
            >
              Sign Up
            </button>
          </form>
          <div class="auth-divider" aria-hidden="true"><span>or</span></div>
          <a class="oauth-button" href="/api/auth/google">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path
                fill="#4285F4"
                d="M21.8 12.23c0-.71-.06-1.23-.2-1.77H12v3.34h5.64c-.11.83-.72 2.08-2.07 2.92l-.02.11 3 2.27.21.02c1.93-1.74 3.04-4.31 3.04-7.39Z"
              />
              <path
                fill="#34A853"
                d="M12 21.94c2.76 0 5.08-.89 6.77-2.42l-3.22-2.4c-.86.59-2.01 1-3.55 1a6.13 6.13 0 0 1-5.8-4.16l-.11.01-3.12 2.36-.04.1A10.1 10.1 0 0 0 12 21.94Z"
              />
              <path
                fill="#FBBC05"
                d="M6.2 13.95A6 6 0 0 1 5.86 12c0-.68.12-1.34.33-1.95l-.01-.13-3.16-2.4-.1.05A9.76 9.76 0 0 0 1.8 12c0 1.61.4 3.13 1.12 4.43l3.28-2.48Z"
              />
              <path
                fill="#EA4335"
                d="M12 5.83c1.95 0 3.26.82 4.01 1.51l2.93-2.78C17.07 2.86 14.76 1.8 12 1.8a10.1 10.1 0 0 0-9.08 5.77l3.27 2.48A6.13 6.13 0 0 1 12 5.83Z"
              />
            </svg>
            Continue with Google
          </a>
        </div>
      </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
