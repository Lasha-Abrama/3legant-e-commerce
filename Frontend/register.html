<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gita_3_Team_2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>input:focus { outline: 1px solid #1c1c1a; }</style>
</head>
<body>
<div id="site-header" data-active="Account"></div>

<main>
  <div class="wrap" style="display:flex;justify-content:center;">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-head__title">Create Account</div>
        <div class="auth-head__sub">Join Loam &amp; Co. for faster checkout</div>
      </div>

      <form id="register-form" style="display:flex;flex-direction:column;gap:14px;">
        <div class="row-2">
          <div class="field"><span class="field__label">FIRST NAME *</span><input class="input" name="firstName" placeholder="First name" required></div>
          <div class="field"><span class="field__label">LAST NAME *</span><input class="input" name="lastName" placeholder="Last name" required></div>
        </div>
        <div class="field">
          <span class="field__label">EMAIL ADDRESS *</span>
          <input class="input" type="email" name="email" placeholder="Your email" required>
        </div>
        <div class="field">
          <span class="field__label">PASSWORD *</span>
          <input class="input" type="password" name="password" placeholder="Create a password" required>
        </div>
        <div class="field">
          <span class="field__label">CONFIRM PASSWORD *</span>
          <input class="input" type="password" name="confirmPassword" placeholder="Repeat password" required>
        </div>
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted);">
          <input type="checkbox" name="agree" style="margin-top:2px;">
          <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Use</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a></span>
        </label>
        <div class="error-text" id="register-error"></div>
        <button class="btn btn--dark" type="submit" style="margin-top:6px;">Create Account</button>
      </form>

      <div class="auth-footer">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>
</main>

<div id="site-footer" data-variant="minimal"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/header.js"></script>
<script src="js/register.js"></script>
</body>
</html>
