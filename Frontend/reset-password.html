<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Gita_3_Team_2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header" data-active="Account"></div>

<main>
  <div class="wrap" style="display:flex;justify-content:center;">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-head__title">Reset password</div>
        <div class="auth-head__sub">Choose a new password with at least 8 characters.</div>
      </div>

      <form id="reset-password-form" style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <span class="field__label">NEW PASSWORD *</span>
          <input class="input" type="password" name="password" placeholder="New password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <span class="field__label">CONFIRM PASSWORD *</span>
          <input class="input" type="password" name="confirmPassword" placeholder="Repeat password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="error-text" id="reset-password-error"></div>
        <div class="success-text" id="reset-password-success"></div>
        <button class="btn btn--dark" type="submit">Reset password</button>
      </form>

      <div class="auth-footer"><a href="login.html">&larr; Back to login</a></div>
    </div>
  </div>
</main>

<div id="site-footer" data-variant="minimal"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/header.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
