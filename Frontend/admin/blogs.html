<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-admin-page="blogs">
<div id="admin-shell"></div>

<main class="admin-main">
  <div class="admin-topbar">
    <h1>Blog</h1>
    <button class="btn btn--dark btn-sm" id="add-blog-btn">+ Add blog post</button>
  </div>

  <div class="admin-card admin-form-panel" id="blog-form-panel" style="display:none;"></div>

  <div class="admin-card">
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr><th></th><th>Title</th><th>Date</th><th>Featured</th><th></th></tr>
        </thead>
        <tbody id="blogs-tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="js/admin-guard.js"></script>
<script src="js/admin-blogs.js"></script>
</body>
</html>
