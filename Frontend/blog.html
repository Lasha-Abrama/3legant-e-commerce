<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Our Blog — 3legant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/design.css" />
    <link rel="stylesheet" href="css/polish.css" />
  </head>
  <body class="page-blog">
    <div id="site-header" data-promo="false" data-active="Blog"></div>

    <main>
      <div class="page-hero" >
        <img
          src="images/blog-hero.png"
          alt="Neutral interior with soft natural light"
          style="
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(1);
          "
        />
        <div class="page-hero__overlay">
          <div class="page-hero__crumb">Home / Blog</div>
          <div class="page-hero__title" >Our Blog</div>
          <div class="page-hero__sub">Home ideas and design inspiration</div>
        </div>
      </div>

      <div class="wrap">
        <div class="section-head" style="margin-bottom: 28px">
          <div class="blog-tabs" aria-label="Blog filters">
            <button class="blog-tab is-active" type="button" data-filter="all">
              All Blog
            </button>
            <button class="blog-tab" type="button" data-filter="featured">
              Featured
            </button>
          </div>
          <label class="blog-sort"
            >Sort by
            <select id="blog-sort-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
            </select>
          </label><div class="layout-selector" id="blog-layouts" aria-label="Blog layout"></div>
        </div>

        <div class="grid-3" id="post-grid"></div>

        <div class="center" style="margin-top: 40px">
          <button class="btn btn--outline" id="blog-show-more" type="button">
            Show more
          </button>
        </div>
      </div>

      <div id="newsletter-slot"></div>
    </main>

    <div id="site-footer" data-variant="full"></div>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/newsletter.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/header.js"></script>
    <script src="js/blog.js"></script>
  </body>
</html>
