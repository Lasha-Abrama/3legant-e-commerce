components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: threelegant_refresh
      description: HttpOnly cookie set by login/register; browsers manage it automatically.
  schemas:
    ForgotPasswordDto:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
        - email
    LoginDto:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          maxLength: 1024
          minLength: 1
      required:
        - email
        - password
    RegisterDto:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 100
          minLength: 1
        lastName:
          type: string
          maxLength: 100
          minLength: 1
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: At most 72 UTF-8 bytes. Include uppercase and lowercase letters, a digit, and a
            punctuation or symbol character.
          example: ExamplePass123!
      required:
        - firstName
        - lastName
        - email
        - password
    ResetPasswordDto:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          maxLength: 128
          minLength: 32
        password:
          type: string
          format: password
          minLength: 8
          description: At most 72 UTF-8 bytes. Include uppercase and lowercase letters, a digit, and a
            punctuation or symbol character.
          example: ExamplePass123!
      required:
        - token
        - password
    CreateBlogDto:
      type: object
      additionalProperties: false
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 80
        supportingImages:
          type: array
          items:
            type: string
          maxItems: 6
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
        content:
          type: string
          minLength: 1
        image:
          type: string
          minLength: 1
        featured:
          type: boolean
      required:
        - title
        - content
        - image
    FindBlogsQueryDto:
      type: object
      additionalProperties: false
      properties:
        category:
          type: string
          maxLength: 80
        exclude:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
        search:
          type: string
          maxLength: 80
        featured:
          type: boolean
        sort:
          type: string
          enum:
            - newest
            - oldest
        page:
          type: integer
          minimum: 1
          default: 1
        take:
          type: integer
          minimum: 1
          default: 12
    UpdateBlogDto:
