# Maintained by hand. Update alongside controllers and DTOs; npm run test:swagger checks validity and route coverage.
openapi: 3.0.3
info:
  title: 3legant E-Commerce API
  version: 1.0.0
  description: YAML source of truth for the NestJS API. All paths are relative to /api on the current
    origin. Use login and paste its accessToken into Authorize for protected operations. Admin
    operations require an administrator account. Try it out sends real requests and can change data.
    Unknown request fields are rejected. MongoDB IDs are 24 hexadecimal characters.
servers:
  - url: /api
    description: Current origin
tags:
  - name: auth
  - name: blogs
  - name: Administration
  - name: Contact
  - name: health
  - name: orders
  - name: payments
  - name: products
  - name: Questions
  - name: Reviews
  - name: users
paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: Register
      operationId: Auth_register
      responses:
        "201":
          description: Created / operation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: Rotating HttpOnly threelegant_refresh session cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDto"
  /auth/login:
    post:
      tags:
        - auth
      summary: Login
      operationId: Auth_login
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: Rotating HttpOnly threelegant_refresh session cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
  /auth/google:
    get:
      tags:
        - auth
      summary: Google Login
      operationId: Auth_googleLogin
      responses:
        "302":
          description: Redirect to Google or the frontend callback.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: next
          in: query
          required: false
          schema:
            type: string
      description: Browser navigation endpoint; open in the browser to complete the OAuth redirect and
        cookie flow.
  /auth/google/callback:
    get:
      tags:
        - auth
      summary: Google Callback
      operationId: Auth_googleCallback
      responses:
        "302":
          description: Redirect to Google or the frontend callback.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      description: Browser navigation endpoint; open in the browser to complete the OAuth redirect and
        cookie flow.
  /auth/google/session:
    get:
      tags:
        - auth
      summary: Google Session
      operationId: Auth_googleSession
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: Exchanges and clears the temporary HttpOnly Google handoff cookie after the OAuth callback.
  /auth/forgot-password:
    post:
      tags:
        - auth
      summary: Forgot Password
      operationId: Auth_forgotPassword
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
  /auth/reset-password:
    post:
      tags:
        - auth
      summary: Reset Password
      operationId: Auth_resetPassword
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
  /auth/logout:
    post:
      tags:
        - auth
      summary: Logout
      operationId: Auth_logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh
      operationId: Auth_refresh
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          headers:
            Set-Cookie:
              description: Rotating HttpOnly threelegant_refresh session cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security:
        - refreshCookie: []
      description: "Uses the HttpOnly threelegant_refresh cookie and requires X-Requested-With:
        threelegant. When Origin is supplied it must match FRONTEND_URL. Cross-site requests are
        rejected. No bearer token is required."
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          schema:
            type: string
            enum:
              - threelegant
            default: threelegant
  /auth/me:
    get:
      tags:
        - auth
      summary: Me
      operationId: Auth_me
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    allOf:
                      - $ref: "#/components/schemas/SafeUser"
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      description: "Optional bearer authentication. Returns { user: null } when the token is missing or
        invalid."
      security:
        - {}
        - bearerAuth: []
  /blogs:
    get:
      tags:
        - blogs
      summary: Find All
      operationId: Blogs_findAll
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Blog"
                  total:
                    type: integer
                  page:
                    type: integer
                  take:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: exclude
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - newest
              - oldest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: take
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 12
    post:
      tags:
        - Administration
      summary: Create
      operationId: Blogs_create
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created / operation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlogDto"
  /blogs/{id}:
    get:
      tags:
        - blogs
      summary: Find One
      operationId: Blogs_findOne
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
    patch:
      tags:
        - Administration
      summary: Update
      operationId: Blogs_update
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBlogDto"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
    delete:
      tags:
        - Administration
      summary: Remove
      operationId: Blogs_remove
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
  /admin/contact-messages:
    get:
      tags:
        - Administration
      summary: Find All Messages
      operationId: ContactAdmin_findAllMessages
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/contact-messages/{id}:
    delete:
      tags:
        - Administration
      summary: Remove Message
      operationId: ContactAdmin_removeMessage
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
  /admin/newsletter-subscribers:
    get:
      tags:
        - Administration
      summary: Find All Subscribers
      operationId: ContactAdmin_findAllSubscribers
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/newsletter-subscribers/{id}:
    delete:
      tags:
        - Administration
      summary: Remove Subscriber
      operationId: ContactAdmin_removeSubscriber
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
  //contact:
    post:
      tags:
        - Contact
      summary: Create Message
      operationId: Contact_createMessage
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactMessageDto"
  //newsletter:
    post:
      tags:
        - Contact
      summary: Subscribe
      operationId: Contact_subscribe
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeDto"
  /admin/coupons:
    get:
      tags:
        - Administration
      summary: List
      operationId: Coupons_list
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Administration
      summary: Create
      operationId: Coupons_create
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created / operation completed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponDto"
  /admin/coupons/generate:
    post:
      tags:
        - Administration
      summary: Generate
      operationId: Coupons_generate
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created / operation completed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/coupons/{id}:
    patch:
      tags:
        - Administration
      summary: Update
      operationId: Coupons_update
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCouponDto"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
    delete:
      tags:
