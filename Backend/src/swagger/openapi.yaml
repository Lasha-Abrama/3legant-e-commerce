      summary: Remove
      operationId: Coupons_remove
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
  /health:
    get:
      tags:
        - health
      summary: Check
      operationId: Health_check
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/orders:
    get:
      tags:
        - Administration
      summary: Find All
      operationId: OrdersAdmin_findAll
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/orders/{id}/status:
    patch:
      tags:
        - Administration
      summary: Update Status
      operationId: OrdersAdmin_updateStatus
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
