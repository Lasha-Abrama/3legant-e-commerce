              $ref: "#/components/schemas/UpdateOrderStatusDto"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
  /orders:
    post:
      tags:
        - orders
      summary: Create
      operationId: Orders_create
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created / operation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderDto"
      description: Creates an order using server-side product prices and coupon validation. Card payments
        use Stripe Checkout; PayPal is currently rejected as unavailable.
  /orders/me:
    get:
      tags:
        - orders
      summary: Find Mine
      operationId: Orders_findMine
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /orders/{id}:
    get:
      tags:
        - orders
      summary: Find One
      operationId: Orders_findOne
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
            example: 507f1f77bcf86cd799439011
  /orders/quote:
    post:
      tags:
        - orders
      summary: Quote
      operationId: Orders_quote
      responses:
        "201":
          description: Created / operation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteOrderDto"
      description: Calculates current prices, discount, shipping and total without placing an order.
        Supplied item names/prices are not trusted.
  /admin/payments/orders/{orderId}/refund:
    post:
      tags:
        - Administration
      summary: Refund Order
      operationId: PaymentsAdmin_refundOrder
      description: Requires an administrator access token.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created / operation completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  refundId:
                    type: string
                  status:
                    type: string
                    nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
